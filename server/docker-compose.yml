x-build-args: &build_args
  INSTALL_PYTHON_VERSION: ""
  INSTALL_NODE_VERSION: ""

x-default-volumes: &default_volumes
  volumes:
    - ./:/app
    - node-modules:/app/node_modules
    - ./dev.db:/tmp/dev.db

services:
  survey-flask-dev:
    build:
      context: .
      target: development
      args:
        <<: *build_args
    image: "survey-server-development"
    ports:
      - "8080:5000"
      - "2992:2992"
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      FLASK_ENV: development
      FLASK_DEBUG: 1
      PYTHONIOENCODING: utf-8
    <<: *default_volumes

  survey-flask-prod:
    build:
      context: .
      target: production
      args:
        <<: *build_args
    image: "survey-server-production"
    ports:
      - "8080:5000"
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: 0
      LOG_LEVEL: info
      GUNICORN_WORKERS: 4
    <<: *default_volumes

  survey-manage:
    build:
      context: .
      target: development
      args:
        <<: *build_args
    entrypoint: flask
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: 0
    image: "survey-server-manage"
    stdin_open: true
    tty: true
    <<: *default_volumes

volumes:
  node-modules:
